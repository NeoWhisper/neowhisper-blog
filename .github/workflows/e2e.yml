name: Playwright E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  e2e_filter:
    name: Decide whether E2E is needed
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run || steps.push.outputs.should_run }}
    steps:
      - name: Checkout pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run E2E on pushes
        if: github.event_name == 'push'
        id: push
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Check changed files
        if: github.event_name == 'pull_request'
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...HEAD")"

          # If Git cannot determine the diff, run E2E to fail safe.
          if [ -z "$changed_files" ]; then
            echo "No changed files detected; running E2E as a precaution."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          should_run=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|README.md|CHANGELOG.md|CONTRIBUTING.md|CODE_OF_CONDUCT.md|SECURITY.md|LICENSE|LICENSE.*|BRANCH-WORKFLOW.md)
                ;;
              *.md)
                # Only root-level Markdown files are treated as documentation.
                if [[ "$file" == */* ]]; then
                  should_run=true
                fi
                ;;
              *)
                should_run=true
                ;;
            esac
          done <<< "$changed_files"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  e2e:
    needs: e2e_filter
    # Run if the filter fails; only a successful docs-only classification skips E2E.
    if: ${{ always() && (needs.e2e_filter.result != 'success' || needs.e2e_filter.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify system Chrome
        run: google-chrome --version

      - name: Build application
        run: npm run build

      - name: Run Playwright E2E tests
        env:
          CI: true
        run: npm run test:e2e --silent

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
