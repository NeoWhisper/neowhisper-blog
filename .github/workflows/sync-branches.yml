name: Sync Main to Dev and Contents

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-main-to-dev-and-contents
  cancel-in-progress: false

jobs:
  backmerge:
    if: >-
      github.repository == 'NeoWhisper/neowhisper-blog' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into dev and contents when needed
        run: |
          for branch in dev contents; do
            git checkout "$branch" || git checkout -b "$branch" "origin/$branch"

            if git merge-base --is-ancestor origin/main "$branch"; then
              echo "$branch already contains main; skipping sync."
              continue
            fi

            git merge origin/main --no-edit -m "chore(sync): automated merge of main into $branch"
            git push origin "$branch"
          done
